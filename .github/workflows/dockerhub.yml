name: Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish release image
    uses: ./.github/workflows/build.yml
    with:
      version: sha-${{ github.sha }}
      docker_tags: >-
        -t docker.io/jgaikwad/remux:sha-${{ github.sha }}
        -t docker.io/jgaikwad/remux:latest
      registry_image: docker.io/jgaikwad/remux
      registry: docker.io
      registry_username: jgaikwad
      desktop: false
      ref: ${{ github.sha }}
    # Configure DOCKERHUB_TOKEN as a repository Actions secret. Use a
    # Docker Hub access token with permission to push jgaikwad/remux.
    secrets:
      registry_password: ${{ secrets.DOCKERHUB_TOKEN }}
